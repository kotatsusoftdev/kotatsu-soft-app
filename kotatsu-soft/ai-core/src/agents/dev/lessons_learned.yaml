lesson_items:
- 物理挙動が関与するコードを変更する際は、着地位置や食い込み量がサイズや状況に依存して不整合を起こさないか数式を徹底検証する。
- 予測不能なインタラクションや状態遷移を取り入れる時は、どのステート（接地・空中など）でトリガーが有効になるか明確にガードを設ける。
- 仕様変更によるスコア算出やクリア条件の再定義が発生した場合は、関連する定数や処理が期待通りにスケーリングするか単体レベルで確認する。
