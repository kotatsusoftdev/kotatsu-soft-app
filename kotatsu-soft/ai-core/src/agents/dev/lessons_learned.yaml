lesson_items:
- 積み上がる高さとスコアの不整合を防ぐため、常にオブジェクトサイズに比例した重なり係数を採用して演算を担保する。
- 予測不能な空中移動による事故を防ぐため、物理挙動と入力誘導の適用フェーズは明確に分離し干渉を遮断する。
- 安定した積み上げ品質を維持するため、天井付近の判定は空中の制御不能な状態のみを厳密に抽出して評価する。
