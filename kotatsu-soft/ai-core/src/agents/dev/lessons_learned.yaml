lesson_items:
- 拡大・変形ロジックを追加するときは、固定のピクセル差分を使わず、常にベースサイズに対する比率で計算を連動させる
- 落下物や衝突判定の追加時は、空中制御と接地状態の判定を明確に分離し、意図せぬ瞬間移動やゲームオーバー判定のバグを防ぐ
- スコアや段数などの数値算出ロジックは、見た目と内部データで誤差が生まれないよう、共通の基準値から一貫して導出する
