lesson_items:
- スコープ選定はチームで1案に絞り込み、複雑な物理演算や消去ルールを完全に削ぎ落として素早い実装を最優先する。
- 会議で合意したコア体験と仕様書の整合性を常に保ち、スコア計算や判定条件のズレは仕様書へ速やかに反映させる。
- 発覚した仕様上の不整合（表示の誤差や判定の矛盾）は、役割定義に立ち返り影響範囲を限定して最小限の修正で解決する。
