lesson_items:
- 開発中のスコープ変更や仕様追加が発生した際は、仕様書とコード側で前提となる制限時間や目標値が矛盾しないよう必ず同期させる。
- 物理演算やスコア計算に直結する判定ルールは、オブジェクトのサイズ比率に連動した基準値を導入して整合性を保つ。
- プレイテストで判明したユーザーの操作意図のズレは、対象要素のフィルタリング条件や制御範囲を直接修正してタスクへ反映させる。
