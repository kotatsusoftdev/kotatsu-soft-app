lesson_items:
- 開発初期のスコープ変更に合わせ、仕様書側の目標段数や制限時間といった前提条件も必ず揃えて更新する。
- プレイテストで判明した数値の不整合を防ぐため、物理的な食い込みや判定ルールはサイズ比率に連動させて整合性を保つ。
- 実装のブレや仕様ズレを検知するため、ラウンドごとに発生したユーザー指摘の根本原因を漏れなくタスクへ反映させる。
