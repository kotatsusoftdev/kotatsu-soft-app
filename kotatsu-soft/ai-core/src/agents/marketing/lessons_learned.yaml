lesson_items:
- バズを狙う派手な演出の裏で、スコア計算の細部や物理の整合性を疎かにすると、プレイヤーの信頼を失う致命的な違和感を生む。
- 自由なクリック再配置や軽快な誘導など、プレイヤーに「操っている実感」を与える直接的なインタラクティビティを絶対に死守する。
- 初期アイデアのノリと勢いを最優先しつつ、不自然な制約やストレスの原因となる要素は容赦なく削ぎ落として体験の純度を限界まで高める。
