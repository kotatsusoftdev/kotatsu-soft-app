lesson_items:
- 初期アイデアのノリと勢いで作り上げた尖った演出やバズ要素を、スコア計算の細部や物理の整合性を詰めてプレイヤーが納得する信頼の体験へと昇華する。
- 自由なクリック再配置や軽快な誘導など、プレイヤーが画面内を「完全に操っている実感」を与える直接的なインタラクティビティを死守する。
- 不自然な制約やストレスの原因となる要素を容赦なく削ぎ落とし、初見のインパクトと拡散性を限界まで高めた純度の高い遊びを提供する。
