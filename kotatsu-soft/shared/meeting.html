<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企画会議ログ | KOTATSU SOFT</title>
  <style>
    :root {
      --bg-0: #fff8ef;
      --bg-1: #ffe5bf;
      --bg-2: #ffd095;
      --ink: #1f1a17;
      --ink-soft: #5e4f45;
      --brand-red: #bf2f2f;
      --brand-brown: #7f4a2e;
      --stroke: rgba(87, 50, 34, 0.18);
      --shadow: 0 24px 60px rgba(84, 44, 13, 0.18);
      --chat-bg: #b8c9dc;
      --bubble-left: #ffffff;
      --bubble-right: #8de055;
      --bubble-right-text: #1f3312;
      --system-bg: rgba(255, 255, 255, 0.72);
      --proposal-bg: #fff7df;
      --proposal-border: rgba(191, 47, 47, 0.45);
      --decision-bg: #ffe8c7;
      --decision-border: rgba(127, 74, 46, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 94% -6%, rgba(255, 255, 255, 0.65), transparent 70%),
        radial-gradient(640px 380px at 12% 22%, rgba(255, 255, 255, 0.38), transparent 64%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background-image: radial-gradient(circle at 1px 1px, #000 0.7px, transparent 0.7px);
      background-size: 5px 5px;
      mix-blend-mode: multiply;
    }

    .scene {
      width: min(520px, calc(100% - 20px));
      margin: 10px auto 24px;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 245, 229, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      min-height: calc(100dvh - 34px);
    }

    header {
      position: relative;
      padding: 14px 16px;
      background: linear-gradient(90deg, rgba(191, 47, 47, 0.96), rgba(127, 74, 46, 0.9));
      color: #fff5e6;
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #fff9f0;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .header-copy {
      min-width: 0;
      text-align: right;
    }

    .page-label {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffe8cc;
    }

    .doc-meta {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: rgba(255, 245, 230, 0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }

    .chat-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--chat-bg);
    }

    .chat-meta {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      font-size: 0.78rem;
      color: #334155;
      line-height: 1.5;
    }

    .chat-meta strong {
      color: #1e293b;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status {
      margin: 16px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255, 250, 242, 0.95);
      color: var(--ink-soft);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .status.error {
      border-color: rgba(191, 47, 47, 0.35);
      background: linear-gradient(180deg, #fff5f0, #ffe8dc);
      color: #7b2f12;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 100%;
    }

    .msg-row.left {
      justify-content: flex-start;
    }

    .msg-row.right {
      justify-content: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.system {
      justify-content: center;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
      font-size: 1.05rem;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: min(78%, 320px);
      min-width: 0;
    }

    .msg-row.right .bubble-wrap {
      align-items: flex-end;
    }

    .sender-name {
      margin: 0;
      font-size: 0.72rem;
      color: rgba(30, 41, 59, 0.82);
      padding-left: 4px;
    }

    .msg-row.right .sender-name {
      padding-left: 0;
      padding-right: 4px;
      text-align: right;
    }

    .bubble {
      position: relative;
      padding: 10px 12px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .bubble.left {
      background: var(--bubble-left);
      color: var(--ink);
      border-top-left-radius: 6px;
    }

    .bubble.right {
      background: var(--bubble-right);
      color: var(--bubble-right-text);
      border-top-right-radius: 6px;
    }

    .bubble.proposal {
      background: var(--proposal-bg);
      border: 1.5px solid var(--proposal-border);
    }

    .bubble.decision {
      background: var(--decision-bg);
      border: 1.5px solid var(--decision-border);
      font-weight: 700;
    }

    .system-pill {
      display: inline-block;
      max-width: 92%;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--system-bg);
      color: #475569;
      font-size: 0.78rem;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
      white-space: pre-wrap;
    }

    .time {
      font-size: 0.68rem;
      color: rgba(51, 65, 85, 0.72);
      flex-shrink: 0;
      align-self: flex-end;
      margin-bottom: 2px;
    }

    .phase-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(127, 74, 46, 0.12);
      color: #7f4a2e;
      font-size: 0.68rem;
      font-weight: 700;
      vertical-align: middle;
    }

    footer {
      padding: 10px 14px 14px;
      color: #755f50;
      font-size: 0.74rem;
      text-align: center;
      background: rgba(255, 250, 242, 0.92);
      border-top: 1px solid var(--stroke);
    }

    @media (max-width: 520px) {
      .scene {
        width: 100%;
        margin: 0;
        border-radius: 0;
        min-height: 100dvh;
      }

      .bubble-wrap {
        max-width: 84%;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="scene">
    <header>
      <div class="header-row">
        <a class="back-link" id="backLink" href="../game-projects/index.html">← ポータル</a>
        <div class="header-copy">
          <p class="page-label">KOTATSU SOFT / Meeting</p>
          <p class="doc-meta" id="docMeta" aria-live="polite">企画会議ログ</p>
        </div>
      </div>
    </header>

    <div class="chat-shell">
      <div class="chat-meta" id="chatMeta" hidden></div>
      <p class="status" id="status" aria-live="polite">会議ログを読み込んでいます…</p>
      <div class="chat-log" id="chatLog" hidden aria-live="polite"></div>
    </div>

    <footer>
      Copyright 2026 KOTATSU SOFT. All rights reserved.
    </footer>
  </div>

  <script>
    const MEETING_DIR = "./meeting/";
    const AVATAR_BASE =
      "https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/assets/avatars/";

    const AVATAR_MAP = {
      nobita: { src: `${AVATAR_BASE}nobuta.png`, alt: "のぶ太社長" },
      shizuka: { src: `${AVATAR_BASE}pm.png`, alt: "すずかちゃん" },
      suge: { src: `${AVATAR_BASE}dev.png`, alt: "スゴ杉くん" },
      gian: { src: `${AVATAR_BASE}marketing.png`, alt: "ヂャイアン" },
      system: { emoji: "📋", alt: "SYSTEM" },
    };

    const statusEl = document.getElementById("status");
    const chatLogEl = document.getElementById("chatLog");
    const metaEl = document.getElementById("docMeta");
    const chatMetaEl = document.getElementById("chatMeta");

    function resolveMeetingFile(rawFile) {
      if (typeof rawFile !== "string") return null;
      const trimmed = rawFile.trim();
      if (!trimmed) return null;

      const normalized = trimmed.replace(/\\/g, "/");
      if (normalized.includes("..")) return null;

      if (/^meeting\//i.test(normalized)) {
        const rest = normalized.slice("meeting/".length);
        if (!rest || rest.includes("/")) return null;
        return rest;
      }

      if (normalized.includes("/")) return null;
      if (!/^meeting_.+\.jsonl$/i.test(normalized)) return null;
      return normalized;
    }

    function buildMeetingUrl(fileName) {
      return `${MEETING_DIR}${encodeURIComponent(fileName).replace(/%2F/g, "/")}`;
    }

    function shortenDisplayName(name) {
      if (typeof name !== "string") return "";
      return name
        .replace(/\(PM\)/gi, "")
        .replace(/\(エンジニア\)/g, "")
        .replace(/\(マーケ\)/g, "")
        .trim();
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function showError(message) {
      statusEl.textContent = message;
      statusEl.classList.add("error");
      statusEl.hidden = false;
      chatLogEl.hidden = true;
      chatMetaEl.hidden = true;
    }

    function createAvatar(avatarKey, altText) {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      const config = AVATAR_MAP[avatarKey] || AVATAR_MAP.system;

      if (config.src) {
        const img = document.createElement("img");
        img.src = config.src;
        img.alt = altText || config.alt || avatarKey;
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => {
          img.remove();
          avatar.textContent = config.emoji || "🤖";
        });
        avatar.appendChild(img);
      } else {
        avatar.textContent = config.emoji || "🤖";
        avatar.setAttribute("aria-label", altText || config.alt || avatarKey);
      }

      return avatar;
    }

    function renderMessage(message) {
      if (message.type === "system" || message.role === "system") {
        const row = document.createElement("div");
        row.className = "msg-row system";
        const pill = document.createElement("div");
        pill.className = "system-pill";
        pill.textContent = message.message || "";
        row.appendChild(pill);
        return row;
      }

      const side = message.side === "right" ? "right" : "left";
      const row = document.createElement("div");
      row.className = `msg-row ${side}`;
      row.dataset.messageId = message.id || "";

      row.appendChild(createAvatar(message.avatar, message.display_name));

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const name = document.createElement("p");
      name.className = "sender-name";
      name.textContent = shortenDisplayName(message.display_name);
      wrap.appendChild(name);

      const bubble = document.createElement("div");
      bubble.className = `bubble ${side}`;
      if (message.type === "proposal") bubble.classList.add("proposal");
      if (message.type === "decision") bubble.classList.add("decision");
      bubble.textContent = message.message || "";
      wrap.appendChild(bubble);

      row.appendChild(wrap);

      const time = document.createElement("span");
      time.className = "time";
      time.textContent = formatTime(message.timestamp);
      row.appendChild(time);

      return row;
    }

    function parseJsonl(text) {
      const messages = [];
      const lines = text.split(/\r?\n/);

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i].trim();
        if (!line) continue;
        try {
          const payload = JSON.parse(line);
          if (payload && typeof payload === "object") {
            messages.push(payload);
          }
        } catch (_error) {
          throw new Error(`JSONL の ${i + 1} 行目が不正です。`);
        }
      }

      return messages;
    }

    function extractTheme(messages) {
      for (const message of messages) {
        if (message.type !== "system") continue;
        const text = String(message.message || "");
        if (text.startsWith("テーマ：")) {
          return text.slice("テーマ：".length).trim();
        }
      }
      return "";
    }

    function renderChat(messages, fileName) {
      statusEl.hidden = true;
      statusEl.classList.remove("error");
      chatLogEl.innerHTML = "";

      for (const message of messages) {
        chatLogEl.appendChild(renderMessage(message));
      }

      chatLogEl.hidden = false;
      metaEl.textContent = fileName.replace(/^meeting_|\.jsonl$/gi, "");

      const theme = extractTheme(messages);
      if (theme) {
        chatMetaEl.innerHTML = `<strong>企画テーマ</strong> ${theme}<span class="phase-tag">${messages.length} messages</span>`;
        chatMetaEl.hidden = false;
      }

      document.title = `企画会議 | ${theme || fileName} | KOTATSU SOFT`;
    }

    async function loadMeetingLog() {
      const params = new URLSearchParams(window.location.search);
      const fileName = resolveMeetingFile(params.get("file"));

      if (!fileName) {
        showError("会議ログファイルが指定されていません。URL に ?file=meeting_xxx.jsonl を付けてアクセスしてください。");
        return;
      }

      try {
        const response = await fetch(buildMeetingUrl(fileName), {
          method: "GET",
          cache: "no-store",
          headers: {
            accept: "application/x-ndjson, application/json, text/plain, */*",
          },
        });

        if (!response.ok) {
          showError(`会議ログを読み込めませんでした（${response.status}）。ファイルが存在するか確認してください。`);
          return;
        }

        const jsonl = await response.text();
        const messages = parseJsonl(jsonl);

        if (!messages.length) {
          showError("会議ログが空です。");
          return;
        }

        renderChat(messages, fileName);
      } catch (error) {
        const message = error instanceof Error ? error.message : "会議ログの取得中にエラーが発生しました。";
        showError(`${message} ローカルサーバー経由で開いているか確認してください。`);
      }
    }

    async function resolvePortalUrl() {
      const backLink = document.getElementById("backLink");
      if (!backLink) return;

      try {
        const response = await fetch("../game-projects/index.html", {
          method: "HEAD",
          cache: "no-store",
        });
        backLink.href = response.ok ? "../game-projects/index.html" : "../index.html";
      } catch (_error) {
        backLink.href = "../index.html";
      }
    }

    void resolvePortalUrl();
    void loadMeetingLog();
  </script>
</body>
</html>
