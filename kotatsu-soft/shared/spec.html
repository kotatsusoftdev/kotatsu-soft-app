<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仕様書 | KOTATSU SOFT</title>
  <style>
    :root {
      --bg-0: #fff8ef;
      --bg-1: #ffe5bf;
      --bg-2: #ffd095;
      --ink: #1f1a17;
      --ink-soft: #5e4f45;
      --brand-red: #bf2f2f;
      --brand-brown: #7f4a2e;
      --brand-cream: #fff4df;
      --card: rgba(255, 250, 242, 0.92);
      --stroke: rgba(87, 50, 34, 0.18);
      --shadow: 0 24px 60px rgba(84, 44, 13, 0.18);
      --code-bg: #2a211c;
      --code-inline-bg: rgba(127, 74, 46, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 94% -6%, rgba(255, 255, 255, 0.65), transparent 70%),
        radial-gradient(640px 380px at 12% 22%, rgba(255, 255, 255, 0.38), transparent 64%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background-image: radial-gradient(circle at 1px 1px, #000 0.7px, transparent 0.7px);
      background-size: 5px 5px;
      mix-blend-mode: multiply;
    }

    .scene {
      width: min(860px, calc(100% - 28px));
      margin: 14px auto 32px;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 245, 229, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    header {
      position: relative;
      padding: 20px clamp(16px, 3vw, 28px);
      background: linear-gradient(90deg, rgba(191, 47, 47, 0.96), rgba(127, 74, 46, 0.9));
      color: #fff5e6;
      isolation: isolate;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -90px;
      width: 220px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      filter: blur(1px);
      z-index: -1;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #fff9f0;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: transform 160ms ease, background 160ms ease;
      white-space: nowrap;
    }

    .back-link:hover,
    .back-link:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.24);
    }

    .page-label {
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffe8cc;
    }

    .doc-meta {
      margin: 0;
      font-size: 0.82rem;
      color: rgba(255, 245, 230, 0.88);
      word-break: break-all;
    }

    .content-wrap {
      padding: clamp(20px, 4vw, 36px) clamp(18px, 4vw, 40px) 40px;
    }

    .status {
      margin: 0;
      padding: 18px 20px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: var(--card);
      color: var(--ink-soft);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .status.error {
      border-color: rgba(191, 47, 47, 0.35);
      background: linear-gradient(180deg, #fff5f0, #ffe8dc);
      color: #7b2f12;
    }

    .markdown-body {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: clamp(22px, 4vw, 36px);
      box-shadow: 0 10px 26px rgba(88, 53, 21, 0.08);
      line-height: 1.75;
      font-size: 1rem;
      color: var(--ink);
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: var(--brand-brown);
      line-height: 1.35;
      letter-spacing: 0.02em;
    }

    .markdown-body h1 {
      margin: 0 0 1.1em;
      padding-bottom: 0.45em;
      border-bottom: 2px solid rgba(191, 47, 47, 0.35);
      font-size: clamp(1.55rem, 3.5vw, 2rem);
      color: #7b2f12;
    }

    .markdown-body h2 {
      margin: 2em 0 0.75em;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--stroke);
      font-size: clamp(1.25rem, 2.6vw, 1.45rem);
    }

    .markdown-body h3 {
      margin: 1.6em 0 0.6em;
      font-size: clamp(1.08rem, 2.2vw, 1.2rem);
      color: #8f421b;
    }

    .markdown-body h4 {
      margin: 1.3em 0 0.5em;
      font-size: 1.02rem;
    }

    .markdown-body p {
      margin: 0 0 1em;
      color: var(--ink-soft);
    }

    .markdown-body strong {
      color: var(--ink);
      font-weight: 800;
    }

    .markdown-body em {
      font-style: italic;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin: 0 0 1.1em;
      padding-left: 1.45em;
      color: var(--ink-soft);
    }

    .markdown-body li {
      margin: 0.35em 0;
    }

    .markdown-body li > ul,
    .markdown-body li > ol {
      margin-top: 0.35em;
      margin-bottom: 0.35em;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px dashed rgba(127, 74, 46, 0.35);
      margin: 2em 0;
    }

    .markdown-body blockquote {
      margin: 0 0 1.1em;
      padding: 12px 16px;
      border-left: 4px solid rgba(191, 47, 47, 0.55);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(90deg, rgba(255, 236, 212, 0.65), rgba(255, 248, 240, 0.4));
      color: #57483f;
    }

    .markdown-body blockquote p:last-child {
      margin-bottom: 0;
    }

    .markdown-body code {
      font-family: "Cascadia Code", "Consolas", "Yu Gothic UI", monospace;
      font-size: 0.88em;
      background: var(--code-inline-bg);
      color: #7b2f12;
      padding: 0.15em 0.4em;
      border-radius: 6px;
      border: 1px solid rgba(127, 74, 46, 0.15);
    }

    .markdown-body pre {
      margin: 0 0 1.2em;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--code-bg);
      border: 1px solid rgba(0, 0, 0, 0.2);
      overflow-x: auto;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .markdown-body pre code {
      display: block;
      padding: 0;
      border: none;
      background: transparent;
      color: #f5e6d3;
      font-size: 0.86rem;
      line-height: 1.6;
      white-space: pre;
    }

    .markdown-body a {
      color: var(--brand-red);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: rgba(191, 47, 47, 0.4);
      text-underline-offset: 2px;
    }

    .markdown-body a:hover,
    .markdown-body a:focus-visible {
      text-decoration-color: var(--brand-red);
    }

    .markdown-body table {
      width: 100%;
      margin: 0 0 1.2em;
      border-collapse: collapse;
      font-size: 0.94rem;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--stroke);
      padding: 10px 12px;
      text-align: left;
    }

    .markdown-body th {
      background: linear-gradient(180deg, #fff5e8, #ffe4c0);
      color: #7b2f12;
      font-weight: 800;
    }

    .markdown-body tr:nth-child(even) td {
      background: rgba(255, 248, 240, 0.6);
    }

    footer {
      padding: 14px 18px 18px;
      color: #755f50;
      font-size: 0.79rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    @media (max-width: 520px) {
      .header-row {
        align-items: flex-start;
      }

      .markdown-body {
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="scene">
    <header>
      <div class="header-row">
        <a class="back-link" id="backLink" href="../index.html">← ポータルに戻る</a>
        <div>
          <p class="page-label">KOTATSU SOFT / Spec</p>
          <p class="doc-meta" id="docMeta" aria-live="polite"></p>
        </div>
      </div>
    </header>

    <div class="content-wrap">
      <p class="status" id="status" aria-live="polite">仕様書を読み込んでいます…</p>
      <article class="markdown-body" id="markdownBody" hidden></article>
    </div>

    <footer>
      Copyright 2026 KOTATSU SOFT. All rights reserved.
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const SPECS_DIR = "./specs/";

    const statusEl = document.getElementById("status");
    const bodyEl = document.getElementById("markdownBody");
    const metaEl = document.getElementById("docMeta");

    function resolveSpecFile(rawFile) {
      if (typeof rawFile !== "string") return null;
      const trimmed = rawFile.trim();
      if (!trimmed) return null;

      const normalized = trimmed.replace(/\\/g, "/");
      if (normalized.includes("..")) return null;

      if (/^specs\//i.test(normalized)) {
        const rest = normalized.slice("specs/".length);
        if (!rest || rest.includes("/")) return null;
        return rest;
      }

      if (normalized.includes("/")) return null;
      if (!/\.md$/i.test(normalized)) return null;
      return normalized;
    }

    function buildSpecUrl(fileName) {
      return `${SPECS_DIR}${encodeURIComponent(fileName).replace(/%2F/g, "/")}`;
    }

    function showError(message) {
      statusEl.textContent = message;
      statusEl.classList.add("error");
      statusEl.hidden = false;
      bodyEl.hidden = true;
    }

    function showContent(html, fileName) {
      statusEl.hidden = true;
      statusEl.classList.remove("error");
      bodyEl.innerHTML = html;
      bodyEl.hidden = false;
      metaEl.textContent = fileName;
      document.title = `${fileName.replace(/\.md$/i, "")} | KOTATSU SOFT`;
    }

    async function loadSpec() {
      const params = new URLSearchParams(window.location.search);
      const fileName = resolveSpecFile(params.get("file"));

      if (!fileName) {
        showError("仕様書ファイルが指定されていません。URL に ?file=spec_xxx.md を付けてアクセスしてください。");
        return;
      }

      try {
        const response = await fetch(buildSpecUrl(fileName), {
          method: "GET",
          cache: "no-store",
          headers: {
            accept: "text/markdown, text/plain, */*",
          },
        });

        if (!response.ok) {
          showError(`仕様書を読み込めませんでした（${response.status}）。ファイルが存在するか確認してください。`);
          return;
        }

        const markdown = await response.text();
        if (typeof marked === "undefined") {
          showError("Markdown パーサーの読み込みに失敗しました。ページを再読み込みしてください。");
          return;
        }

        marked.setOptions({
          gfm: true,
          breaks: false,
        });

        showContent(marked.parse(markdown), fileName);
      } catch (_error) {
        showError("仕様書の取得中にエラーが発生しました。ローカルサーバー経由で開いているか確認してください。");
      }
    }

    async function resolvePortalUrl() {
      const backLink = document.getElementById("backLink");
      if (!backLink) return;

      try {
        const response = await fetch("../index.html", {
          method: "HEAD",
          cache: "no-store",
        });
        backLink.href = response.ok ? "../index.html" : "../game-projects/index.html";
      } catch (_error) {
        backLink.href = "../game-projects/index.html";
      }
    }

    void resolvePortalUrl();
    void loadSpec();
  </script>
</body>
</html>
