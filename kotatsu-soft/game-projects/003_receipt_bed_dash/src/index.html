        ctx.fillStyle = "#fff";
        ctx.font = "13px Trebuchet MS, sans-serif";
        ctx.fillText("60日間レシートを避けて生き残れ", W / 2, H * 0.56);
        ctx.fillStyle = "#ffd54f";
        ctx.font = "12px Trebuchet MS, sans-serif";
        ctx.fillText("収入 − 請求 ＝ 所持金がスコア", W / 2, H * 0.61);
        ctx.fillStyle = "#ffcdd2";
        ctx.fillText("所持金が " + formatYen(HELD_FLOOR) + " でゲームオーバー", W / 2, H * 0.66);

        ctx.fillStyle = "#80cbc4";
        ctx.font = "bold 15px Trebuchet MS, sans-serif";
        const pulse = 0.7 + Math.sin(performance.now() * 0.006) * 0.3;
        ctx.globalAlpha = pulse;
        ctx.fillText("タップ / Space でスタート", W / 2, H * 0.74);
        ctx.globalAlpha = 1;

        if (bestScore != null) {
          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.font = "12px Trebuchet MS, sans-serif";
          ctx.fillText("ベストスコア " + formatYen(bestScore), W / 2, H * 0.82);
        }
      }

      function drawOverlayGameover() {
        const summary = getAccountingSummary();
        const compare = getCompareText();
        const held = heldMoney();
        const title = getRankTitle(held, cleared);

        if (cleared) {
          ctx.fillStyle = "rgba(8, 48, 40, 0.82)";
          ctx.fillRect(0, 0, W, H);
          const sun = ctx.createRadialGradient(W * 0.5, H * 0.2, 10, W * 0.5, H * 0.2, H * 0.5);
          sun.addColorStop(0, "rgba(255, 236, 160, 0.35)");
          sun.addColorStop(1, "rgba(255, 236, 160, 0)");
          ctx.fillStyle = sun;
          ctx.fillRect(0, 0, W, H);

          ctx.fillStyle = "#ffd54f";
          ctx.font = "bold 28px Trebuchet MS, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("無事退院！", W / 2, H * 0.16);
          ctx.fillStyle = "#80cbc4";
          ctx.font = "bold 18px Trebuchet MS, sans-serif";
          ctx.fillText("【" + title + "】", W / 2, H * 0.215);

          ctx.fillStyle = "rgba(255,255,255,0.8)";
          ctx.font = "12px Trebuchet MS, sans-serif";
          ctx.fillText("所持金（スコア）", W / 2, H * 0.27);
          ctx.fillStyle = held >= 0 ? "#80cbc4" : "#ff1744";
          ctx.font = "bold 34px Trebuchet MS, sans-serif";
          ctx.fillText(formatYen(held), W / 2, H * 0.335);

          drawIncomeBillBars(W / 2, H * 0.4);

          ctx.fillStyle = "rgba(255,255,255,0.75)";
          ctx.font = "11px Trebuchet MS, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(summary, W / 2, H * 0.5);

          if (isNewRecord) {
            ctx.fillStyle = "#ffd54f";
            ctx.font = "bold 14px Trebuchet MS, sans-serif";
            ctx.fillText("NEW RECORD! ベストスコア更新", W / 2, H * 0.56);
          } else if (bestScore != null) {
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.font = "12px Trebuchet MS, sans-serif";
            ctx.fillText("ベストスコア " + formatYen(bestScore), W / 2, H * 0.56);
          }

          if (compare) {
            ctx.fillStyle = compare.indexOf("多い") >= 0 ? "#80cbc4" : "#ffcc80";
            ctx.font = "12px Trebuchet MS, sans-serif";
            ctx.fillText(compare, W / 2, H * 0.61);
          }

          ctx.fillStyle = "#80cbc4";
          ctx.font = "bold 15px Trebuchet MS, sans-serif";
          const pulse = 0.7 + Math.sin(performance.now() * 0.006) * 0.3;
          ctx.globalAlpha = pulse;
          ctx.fillText("タップ / R でリトライ", W / 2, H * 0.74);
          ctx.globalAlpha = 1;
          return;
        }

        ctx.fillStyle = "rgba(40, 8, 8, 0.55)";
        ctx.fillRect(0, 0, W, H);
        drawLifeFlash(0.92);
        ctx.fillStyle = "rgba(40, 8, 8, 0.28)";
        ctx.fillRect(0, 0, W, H);

        drawSkull(W / 2, H * 0.12, 0.5);

        ctx.fillStyle = "#ffcdd2";
        ctx.font = "bold 24px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("破産…", W / 2, H * 0.22);
        ctx.fillStyle = "#ef9a9a";
        ctx.font = "bold 16px Trebuchet MS, sans-serif";
        ctx.fillText("【" + title + "】", W / 2, H * 0.27);

        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.font = "12px Trebuchet MS, sans-serif";
        ctx.fillText("所持金", W / 2, H * 0.32);
        ctx.fillStyle = held >= 0 ? "#ffcc80" : "#ff1744";
        ctx.font = "bold 32px Trebuchet MS, sans-serif";
        ctx.fillText(formatYen(held), W / 2, H * 0.38);

        drawIncomeBillBars(W / 2, H * 0.44);

        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.font = "11px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(summary, W / 2, H * 0.54);

        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.font = "12px Trebuchet MS, sans-serif";
        ctx.fillText("耐えた日数 " + Math.floor(surviveSec) + "日", W / 2, H * 0.59);

        if (isNewRecord) {
          ctx.fillStyle = "#ffd54f";
          ctx.font = "bold 13px Trebuchet MS, sans-serif";
          ctx.fillText("NEW RECORD!", W / 2, H * 0.64);
        } else if (bestScore != null) {
          ctx.fillStyle = "rgba(255,255,255,0.65)";
          ctx.font = "12px Trebuchet MS, sans-serif";
          ctx.fillText("ベストスコア " + formatYen(bestScore), W / 2, H * 0.64);
        }

        if (compare) {
          ctx.fillStyle = "#ffcc80";
          ctx.font = "12px Trebuchet MS, sans-serif";
          ctx.fillText(compare, W / 2, H * 0.69);
        }

        ctx.fillStyle = "#80cbc4";
        ctx.font = "bold 15px Trebuchet MS, sans-serif";
        const pulse = 0.7 + Math.sin(performance.now() * 0.006) * 0.3;
        ctx.globalAlpha = pulse;
        ctx.fillText("タップ / R でリトライ", W / 2, H * 0.8);
        ctx.globalAlpha = 1;
      }

      function draw() {
        drawCorridor();
        drawSpeedStreaks();

        for (const n of nurses) drawNurse(n);
        for (const r of receipts) drawReceipt(r);
        for (const c of coins) drawCoin(c);
        if (
          state === STATE.PLAYING ||
          state === STATE.DYING ||
          state === STATE.CLEARING ||
          state === STATE.GAMEOVER
        ) {
          drawPlayer();
        }
        drawParticles();
        drawFloatTexts();
        if (state === STATE.PLAYING || state === STATE.CLEARING) {
          drawHud();
        }
        drawStackedReceipts();
        drawBillPop();
        drawHitItemFlash();
        drawMilestoneFlash();

        if (state === STATE.PLAYING || state === STATE.DYING) {
          const br = billRatio();
          if (br > 0.02) {
            let alpha = br * 0.45;
            if (br > 0.7) {
              alpha += 0.06 + Math.sin(performance.now() * 0.012) * 0.05;
            }
            ctx.fillStyle = `rgba(180, 20, 30, ${Math.min(0.62, alpha)})`;
            ctx.fillRect(0, 0, W, H);
            const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.2, W * 0.5, H * 0.5, H * 0.75);
            vig.addColorStop(0, "rgba(120, 0, 0, 0)");
            vig.addColorStop(1, `rgba(80, 0, 0, ${br * 0.35})`);
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, W, H);
          }
        }

        if (state === STATE.PLAYING && daysLeft() <= 10) {
          const pulse = 0.35 + Math.sin(performance.now() * 0.014) * 0.25;
          ctx.strokeStyle = `rgba(255, 23, 68, ${pulse})`;
          ctx.lineWidth = 8;
          ctx.strokeRect(4, 4, W - 8, H - 8);
          ctx.strokeStyle = `rgba(255, 138, 128, ${pulse * 0.7})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(10, 10, W - 20, H - 20);
        }

        if (flash > 0) {
          ctx.fillStyle = `rgba(198, 40, 40, ${flash * 0.55})`;
          ctx.fillRect(0, 0, W, H);
        }
        if (healFlash > 0) {
          ctx.fillStyle = `rgba(76, 175, 80, ${healFlash * 0.35})`;
          ctx.fillRect(0, 0, W, H);
        }

        if (state === STATE.TITLE) drawOverlayTitle();
        if (state === STATE.DYING) drawDying();
        if (state === STATE.CLEARING) drawClearing();
        if (state === STATE.GAMEOVER) drawOverlayGameover();
      }

      function clearJust() {
        for (const k of Object.keys(keysJust)) delete keysJust[k];
        tapPending = false;
      }

      function loop(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
        lastTime = now;

        if (state === STATE.TITLE) {
          if (keysJust.Space || keysJust.Enter || tapPending) startGame();
        } else if (state === STATE.PLAYING) {
          updatePlaying(dt);
        } else if (state === STATE.DYING) {
          updateDying(dt);
        } else if (state === STATE.CLEARING) {
          updateClearing(dt);
        } else if (state === STATE.GAMEOVER) {
          if (!cleared) lifeFlashOffset += dt * 40;
          if (keysJust.Space || keysJust.Enter || keysJust.KeyR || tapPending) startGame();
        }

        draw();
        clearJust();
        requestAnimationFrame(loop);
      }

      function canvasXFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const scale = W / rect.width;
        return (clientX - rect.left) * scale;
      }

      window.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS", "KeyR", "Enter"].includes(e.code)) {
          e.preventDefault();
        }
        if (!keys[e.code]) {
          keysJust[e.code] = true;
          if (e.code === "Space") {
            ensureAudio();
            if (state === STATE.PLAYING) tryDash();
          }
        }
        keys[e.code] = true;
      });

      window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      canvas.addEventListener("pointerdown", (e) => {
        ensureAudio();
        canvas.setPointerCapture(e.pointerId);
        pointerActive = true;
        pointerX = canvasXFromEvent(e);
        const now = performance.now();
        if (state === STATE.PLAYING && now - lastTapAt < 280) {
          tryDash();
          lastTapAt = 0;
        } else {
          lastTapAt = now;
          tapPending = true;
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!pointerActive) return;
        pointerX = canvasXFromEvent(e);
      });

      canvas.addEventListener("pointerup", () => {
        pointerActive = false;
        pointerX = null;
      });

      canvas.addEventListener("pointercancel", () => {
        pointerActive = false;
        pointerX = null;
      });

      if (shareBtn) {
        shareBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openXShare();
        });
      }

      setShareVisible(false);
      lastTime = performance.now();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
