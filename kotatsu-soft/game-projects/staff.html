<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コタツ・ソフト | 社員紹介</title>
  <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./assets/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./assets/favicon-180.png" sizes="180x180" />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-0: #fff8ef;
      --bg-1: #ffe5bf;
      --bg-2: #ffd095;
      --ink: #1f1a17;
      --ink-soft: #5e4f45;
      --brand-red: #bf2f2f;
      --brand-brown: #7f4a2e;
      --brand-cream: #fff4df;
      --card: rgba(255, 250, 242, 0.78);
      --stroke: rgba(87, 50, 34, 0.18);
      --shadow: 0 24px 60px rgba(84, 44, 13, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 94% -6%, rgba(255, 255, 255, 0.65), transparent 70%),
        radial-gradient(640px 380px at 12% 22%, rgba(255, 255, 255, 0.38), transparent 64%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background-image:
        radial-gradient(circle at 1px 1px, #000 0.7px, transparent 0.7px);
      background-size: 5px 5px;
      mix-blend-mode: multiply;
    }

    .scene {
      width: min(1120px, calc(100% - 28px));
      margin: 14px auto 32px;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 245, 229, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    header {
      position: relative;
      padding: 24px clamp(16px, 3vw, 34px) 10px;
      background:
        linear-gradient(90deg, rgba(191, 47, 47, 0.96), rgba(127, 74, 46, 0.9));
      color: #fff5e6;
      isolation: isolate;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -110px;
      width: 270px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      filter: blur(1px);
      z-index: -1;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 12px;
      object-fit: cover;
      background: #fff4df;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 14px rgba(64, 24, 8, 0.22);
    }

    .logo {
      font-family: "DotGothic16", sans-serif;
      letter-spacing: 0.08em;
      font-weight: 400;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      margin: 0;
    }

    .tag {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffe8cc;
    }

    .back-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: start;
      text-decoration: none;
      color: #fff9f0;
      background: linear-gradient(90deg, #c63a31, #f06d36);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 22px rgba(94, 31, 12, 0.24);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .back-cta:hover,
    .back-cta:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 12px 26px rgba(94, 31, 12, 0.3);
    }

    main {
      padding: 28px clamp(16px, 4vw, 40px) 30px;
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .sec-head h1 {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #7b2f12;
    }

    .sec-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    .staff-card {
      border: 1px solid rgba(123, 47, 18, 0.16);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255, 252, 246, 0.92), rgba(255, 236, 210, 0.88));
      padding: 12px 10px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(88, 53, 21, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
      cursor: pointer;
      font: inherit;
      color: inherit;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }

    .staff-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(88, 53, 21, 0.14);
    }

    .staff-card:focus-visible {
      outline: 2px solid rgba(191, 47, 47, 0.55);
      outline-offset: 2px;
    }

    .staff-card.is-selected {
      border-color: rgba(191, 47, 47, 0.55);
      background: linear-gradient(180deg, rgba(255, 248, 236, 0.98), rgba(255, 220, 180, 0.95));
      box-shadow: 0 12px 28px rgba(127, 74, 46, 0.2);
      transform: translateY(-2px);
    }

    .staff-card.is-error {
      cursor: default;
    }

    .staff-avatar {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 8px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe8c8, #ffd095);
      border: 1px solid rgba(123, 47, 18, 0.14);
    }

    .staff-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .staff-name {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 800;
      color: #7b2f12;
      letter-spacing: 0.03em;
    }

    .staff-role {
      margin: 4px 0 0;
      font-size: 0.76rem;
      color: #6f5849;
      line-height: 1.45;
    }

    .staff-detail {
      margin-top: 18px;
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid rgba(123, 47, 18, 0.14);
      border-radius: 18px;
      background:
        radial-gradient(520px 180px at 8% 0%, rgba(255, 255, 255, 0.55), transparent 70%),
        linear-gradient(180deg, rgba(255, 252, 246, 0.96), rgba(255, 236, 210, 0.9));
      box-shadow: 0 10px 28px rgba(88, 53, 21, 0.08);
      min-height: 180px;
    }

    .staff-detail[hidden] {
      display: none;
    }

    .staff-detail-head {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .staff-detail-avatar {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe8c8, #ffd095);
      border: 1px solid rgba(123, 47, 18, 0.14);
      box-shadow: 0 8px 18px rgba(88, 53, 21, 0.12);
    }

    .staff-detail-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .staff-detail-identity {
      min-width: 0;
    }

    .staff-detail-name {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.25rem, 2.6vw, 1.7rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #7b2f12;
    }

    .staff-detail-role {
      margin: 6px 0 0;
      font-size: 0.92rem;
      color: #6f5849;
      letter-spacing: 0.02em;
    }

    .staff-detail-section + .staff-detail-section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(123, 47, 18, 0.12);
    }

    .staff-detail-label {
      margin: 0 0 10px;
      font-family: "DotGothic16", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: #bf2f2f;
    }

    .staff-detail-body {
      margin: 0;
      font-size: clamp(0.98rem, 1.8vw, 1.12rem);
      line-height: 1.75;
      color: #3d3028;
    }

    .staff-detail-body + .staff-detail-body {
      margin-top: 10px;
    }

    .staff-detail-lessons {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 12px;
      counter-reset: lesson;
    }

    .staff-detail-lessons li {
      position: relative;
      padding-left: 1.6em;
      font-size: clamp(0.98rem, 1.8vw, 1.12rem);
      line-height: 1.75;
      color: #3d3028;
    }

    .staff-detail-lessons li::before {
      content: counter(lesson);
      counter-increment: lesson;
      position: absolute;
      left: 0;
      top: 0.1em;
      font-family: "DotGothic16", sans-serif;
      font-size: 0.85em;
      color: #bf2f2f;
    }

    .staff-detail-fallback {
      margin: 0;
      color: #8a4a3a;
      font-size: 0.95rem;
    }

    footer {
      padding: 14px 18px 18px;
      color: #755f50;
      font-size: 0.79rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 700ms ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .brand-row {
        align-items: flex-start;
      }

      .back-cta {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 720px) {
      .staff-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .staff-detail-head {
        align-items: flex-start;
      }
    }

    @media (max-width: 520px) {
      .staff-grid {
        gap: 8px;
      }

      .staff-card {
        padding: 10px 8px;
      }

      .staff-avatar {
        width: 48px;
        height: 48px;
      }

      .staff-detail-avatar {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="scene">
    <header>
      <div class="brand-row">
        <div class="brand-copy">
          <div class="brand-mark">
            <img
              class="brand-icon"
              src="./assets/channel-icon.png"
              alt=""
              width="48"
              height="48"
              decoding="async"
            />
            <p class="logo">コタツ・ソフト</p>
          </div>
          <p class="tag">素人社長とAI社員がつくる、あたたかいインディーズゲームスタジオ</p>
        </div>
        <a class="back-cta" href="./index.html">ゲーム一覧へ戻る</a>
      </div>
    </header>

    <main>
      <div class="sec-head fade-up">
        <h1>社員紹介</h1>
        <p>コタツを囲む、小さな開発チーム</p>
      </div>

      <div class="staff-grid fade-up" aria-label="社員紹介" id="staffGrid" role="listbox" aria-activedescendant=""></div>

      <section class="staff-detail fade-up" id="staffDetail" aria-live="polite" hidden></section>
    </main>

    <footer>
      Copyright 2026 コタツ・ソフト. All rights reserved.
    </footer>
  </div>

  <script>
    const CONFIG_BASE =
      "https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/src/agents";

    const AVATAR_BASE =
      "https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/assets/avatars";

    const AI_AGENTS = [
      { role: "pm", avatar: `${AVATAR_BASE}/pm.png` },
      { role: "dev", avatar: `${AVATAR_BASE}/dev.png` },
      { role: "marketing", avatar: `${AVATAR_BASE}/marketing.png` },
    ];

    const NOBUTA = {
      id: "nobuta",
      displayName: "のぶ太社長",
      roleLabel: "アイデア出し・AI社員のしりぬぐい",
      avatar: `${AVATAR_BASE}/nobuta.png`,
      tone: "唯一の人間。AI社員に丸投げの素人社長。",
      mindset: "",
      lessons: null,
      showLessons: false,
    };

    /** @type {Map<string, object>} */
    const staffById = new Map();
    let selectedId = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function createStaffCard(staff) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "staff-card";
      button.id = `staff-card-${staff.id}`;
      button.dataset.staffId = staff.id;
      button.setAttribute("role", "option");
      button.setAttribute("aria-selected", "false");
      button.innerHTML = `
        <div class="staff-avatar">
          <img
            src="${escapeHtml(staff.avatar)}"
            alt="${escapeHtml(staff.displayName)}"
            width="56"
            height="56"
            loading="lazy"
            decoding="async"
          />
        </div>
        <p class="staff-name">${escapeHtml(staff.displayName)}</p>
        <p class="staff-role">${escapeHtml(staff.roleLabel)}</p>
      `;
      button.addEventListener("click", () => selectStaff(staff.id));
      return button;
    }

    function createErrorCard(role) {
      const article = document.createElement("article");
      article.className = "staff-card is-error";
      article.innerHTML = `
        <p class="staff-name">${escapeHtml(role)}</p>
        <p class="staff-role">読み込みエラー</p>
      `;
      return article;
    }

    function renderDetail(staff) {
      const detail = document.getElementById("staffDetail");
      if (!detail) return;

      const personaParts = [staff.tone, staff.mindset].filter(Boolean);
      const personaHtml = personaParts.length
        ? personaParts.map((text) => `<p class="staff-detail-body">${escapeHtml(text)}</p>`).join("")
        : `<p class="staff-detail-fallback">性格情報を取得できませんでした。</p>`;

      let lessonsHtml = "";
      if (staff.showLessons) {
        if (Array.isArray(staff.lessons) && staff.lessons.length > 0) {
          lessonsHtml = `
            <div class="staff-detail-section">
              <h3 class="staff-detail-label">教訓</h3>
              <ol class="staff-detail-lessons">
                ${staff.lessons.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
              </ol>
            </div>
          `;
        } else {
          lessonsHtml = `
            <div class="staff-detail-section">
              <h3 class="staff-detail-label">教訓</h3>
              <p class="staff-detail-fallback">取得できませんでした。</p>
            </div>
          `;
        }
      }

      detail.hidden = false;
      detail.innerHTML = `
        <div class="staff-detail-head">
          <div class="staff-detail-avatar">
            <img
              src="${escapeHtml(staff.avatar)}"
              alt="${escapeHtml(staff.displayName)}"
              width="72"
              height="72"
              decoding="async"
            />
          </div>
          <div class="staff-detail-identity">
            <h2 class="staff-detail-name">${escapeHtml(staff.displayName)}</h2>
            <p class="staff-detail-role">${escapeHtml(staff.roleLabel)}</p>
          </div>
        </div>
        <div class="staff-detail-section">
          <h3 class="staff-detail-label">性格</h3>
          ${personaHtml}
        </div>
        ${lessonsHtml}
      `;
    }

    function selectStaff(id) {
      const staff = staffById.get(id);
      if (!staff) return;

      selectedId = id;
      const grid = document.getElementById("staffGrid");
      if (grid) {
        grid.setAttribute("aria-activedescendant", `staff-card-${id}`);
        for (const card of grid.querySelectorAll(".staff-card[data-staff-id]")) {
          const isSelected = card.dataset.staffId === id;
          card.classList.toggle("is-selected", isSelected);
          card.setAttribute("aria-selected", isSelected ? "true" : "false");
        }
      }
      renderDetail(staff);
    }

    async function fetchYaml(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const text = await response.text();
      return jsyaml.load(text);
    }

    async function loadAgentStaff(agentMeta) {
      try {
        const [config, lessonsPayload] = await Promise.all([
          fetchYaml(`${CONFIG_BASE}/${agentMeta.role}/config.yaml`),
          fetchYaml(`${CONFIG_BASE}/${agentMeta.role}/lessons_learned.yaml`).catch((error) => {
            console.error(`Failed to load lessons for ${agentMeta.role}:`, error);
            return null;
          }),
        ]);

        const agent = config?.agent || {};
        const profile = agent.public_profile || {};
        const persona = agent.persona || {};
        const displayName = profile.display_name || agent.name || agentMeta.role;
        const roleLabel = profile.role_label || agent.title || "";
        const tone = persona.tone || "";
        const mindset = persona.mindset || "";

        if (!profile.display_name && !tone && !mindset) {
          return { error: true, role: agentMeta.role };
        }

        const rawLessons = lessonsPayload?.lesson_items;
        const lessons = Array.isArray(rawLessons)
          ? rawLessons.map((item) => String(item).trim()).filter(Boolean)
          : null;

        return {
          error: false,
          staff: {
            id: agentMeta.role,
            displayName,
            roleLabel,
            avatar: agentMeta.avatar,
            tone,
            mindset,
            lessons,
            showLessons: true,
          },
        };
      } catch (error) {
        console.error(`Failed to load config for ${agentMeta.role}:`, error);
        return { error: true, role: agentMeta.role };
      }
    }

    async function renderAiStaff() {
      const grid = document.getElementById("staffGrid");
      if (!grid || typeof jsyaml === "undefined") return;

      grid.replaceChildren();
      staffById.clear();

      const results = await Promise.all(AI_AGENTS.map((agent) => loadAgentStaff(agent)));
      let firstSelectableId = null;

      for (const result of results) {
        if (result.error) {
          grid.appendChild(createErrorCard(result.role));
          continue;
        }
        staffById.set(result.staff.id, result.staff);
        grid.appendChild(createStaffCard(result.staff));
        if (!firstSelectableId) {
          firstSelectableId = result.staff.id;
        }
      }

      staffById.set(NOBUTA.id, NOBUTA);
      grid.appendChild(createStaffCard(NOBUTA));

      if (firstSelectableId) {
        selectStaff(firstSelectableId);
      } else {
        selectStaff(NOBUTA.id);
      }
    }

    renderAiStaff();
  </script>
</body>
</html>
