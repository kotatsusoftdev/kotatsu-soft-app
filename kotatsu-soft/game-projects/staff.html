<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コタツ・ソフト | 社員紹介</title>
  <link rel="icon" href="./assets/channel-icon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-0: #fff8ef;
      --bg-1: #ffe5bf;
      --bg-2: #ffd095;
      --ink: #1f1a17;
      --ink-soft: #5e4f45;
      --brand-red: #bf2f2f;
      --brand-brown: #7f4a2e;
      --brand-cream: #fff4df;
      --card: rgba(255, 250, 242, 0.78);
      --stroke: rgba(87, 50, 34, 0.18);
      --shadow: 0 24px 60px rgba(84, 44, 13, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 94% -6%, rgba(255, 255, 255, 0.65), transparent 70%),
        radial-gradient(640px 380px at 12% 22%, rgba(255, 255, 255, 0.38), transparent 64%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background-image:
        radial-gradient(circle at 1px 1px, #000 0.7px, transparent 0.7px);
      background-size: 5px 5px;
      mix-blend-mode: multiply;
    }

    .scene {
      width: min(1120px, calc(100% - 28px));
      margin: 14px auto 32px;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 245, 229, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    header {
      position: relative;
      padding: 24px clamp(16px, 3vw, 34px) 10px;
      background:
        linear-gradient(90deg, rgba(191, 47, 47, 0.96), rgba(127, 74, 46, 0.9));
      color: #fff5e6;
      isolation: isolate;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -110px;
      width: 270px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      filter: blur(1px);
      z-index: -1;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 12px;
      object-fit: cover;
      background: #fff4df;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 14px rgba(64, 24, 8, 0.22);
    }

    .logo {
      font-family: "DotGothic16", sans-serif;
      letter-spacing: 0.08em;
      font-weight: 400;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      margin: 0;
    }

    .tag {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffe8cc;
    }

    .back-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: start;
      text-decoration: none;
      color: #fff9f0;
      background: linear-gradient(90deg, #c63a31, #f06d36);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 22px rgba(94, 31, 12, 0.24);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .back-cta:hover,
    .back-cta:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 12px 26px rgba(94, 31, 12, 0.3);
    }

    main {
      padding: 28px clamp(16px, 4vw, 40px) 30px;
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .sec-head h1 {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #7b2f12;
    }

    .sec-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    .staff-card {
      border: 1px solid rgba(123, 47, 18, 0.16);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255, 252, 246, 0.92), rgba(255, 236, 210, 0.88));
      padding: 12px 10px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(88, 53, 21, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .staff-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(88, 53, 21, 0.14);
    }

    .staff-avatar {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 8px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe8c8, #ffd095);
      border: 1px solid rgba(123, 47, 18, 0.14);
    }

    .staff-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .staff-name {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 800;
      color: #7b2f12;
      letter-spacing: 0.03em;
    }

    .staff-role {
      margin: 4px 0 0;
      font-size: 0.76rem;
      color: #6f5849;
      line-height: 1.45;
    }

    .staff-persona {
      margin: 8px 0 0;
      font-size: 0.72rem;
      color: #5e4f45;
      line-height: 1.55;
      text-align: left;
    }

    .staff-persona + .staff-persona {
      margin-top: 6px;
    }

    .staff-card.is-error .staff-persona {
      color: #8a4a3a;
    }

    footer {
      padding: 14px 18px 18px;
      color: #755f50;
      font-size: 0.79rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 700ms ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .brand-row {
        align-items: flex-start;
      }

      .back-cta {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 720px) {
      .staff-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .staff-grid {
        gap: 8px;
      }

      .staff-card {
        padding: 10px 8px;
      }

      .staff-avatar {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="scene">
    <header>
      <div class="brand-row">
        <div class="brand-copy">
          <div class="brand-mark">
            <img
              class="brand-icon"
              src="./assets/channel-icon.png"
              alt=""
              width="48"
              height="48"
              decoding="async"
            />
            <p class="logo">コタツ・ソフト</p>
          </div>
          <p class="tag">素人社長とAI社員がつくる、あたたかいインディーズゲームスタジオ</p>
        </div>
        <a class="back-cta" href="./index.html">ゲーム一覧へ戻る</a>
      </div>
    </header>

    <main>
      <div class="sec-head fade-up">
        <h1>社員紹介</h1>
        <p>コタツを囲む、小さな開発チーム</p>
      </div>

      <div class="staff-grid fade-up" aria-label="AI社員紹介" id="staffGrid">
        <article class="staff-card">
          <div class="staff-avatar">
            <img
              src="https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/assets/avatars/nobuta.png"
              alt="のぶ太社長"
              width="56"
              height="56"
              loading="lazy"
              decoding="async"
            />
          </div>
          <p class="staff-name">のぶ太社長</p>
          <p class="staff-role">アイデア出し・AI社員のしりぬぐい</p>
          <p class="staff-persona">唯一の人間。AI社員に丸投げの素人社長。</p>
        </article>
      </div>
    </main>

    <footer>
      Copyright 2026 コタツ・ソフト. All rights reserved.
    </footer>
  </div>

  <script>
    const CONFIG_BASE =
      "https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/src/agents";

    const AVATAR_BASE =
      "https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/assets/avatars";

    const AI_AGENTS = [
      { role: "pm", avatar: `${AVATAR_BASE}/pm.png` },
      { role: "dev", avatar: `${AVATAR_BASE}/dev.png` },
      { role: "marketing", avatar: `${AVATAR_BASE}/marketing.png` },
    ];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function createErrorCard(role) {
      const article = document.createElement("article");
      article.className = "staff-card is-error";
      article.innerHTML = `
        <p class="staff-name">${escapeHtml(role)}</p>
        <p class="staff-role">読み込みエラー</p>
        <p class="staff-persona">紹介情報を取得できませんでした。</p>
      `;
      return article;
    }

    function createAgentCard(agentMeta, config) {
      const agent = config?.agent || {};
      const profile = agent.public_profile || {};
      const persona = agent.persona || {};
      const displayName = profile.display_name || agent.name || agentMeta.role;
      const roleLabel = profile.role_label || agent.title || "";
      const tone = persona.tone || "";
      const mindset = persona.mindset || "";

      if (!profile.display_name && !tone && !mindset) {
        return createErrorCard(agentMeta.role);
      }

      const article = document.createElement("article");
      article.className = "staff-card";
      article.innerHTML = `
        <div class="staff-avatar">
          <img
            src="${escapeHtml(agentMeta.avatar)}"
            alt="${escapeHtml(displayName)}"
            width="56"
            height="56"
            loading="lazy"
            decoding="async"
          />
        </div>
        <p class="staff-name">${escapeHtml(displayName)}</p>
        <p class="staff-role">${escapeHtml(roleLabel)}</p>
        ${tone ? `<p class="staff-persona">${escapeHtml(tone)}</p>` : ""}
        ${mindset ? `<p class="staff-persona">${escapeHtml(mindset)}</p>` : ""}
      `;
      return article;
    }

    async function loadAgentCard(agentMeta) {
      try {
        const response = await fetch(`${CONFIG_BASE}/${agentMeta.role}/config.yaml`, {
          cache: "no-store",
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const config = jsyaml.load(text);
        return createAgentCard(agentMeta, config);
      } catch (error) {
        console.error(`Failed to load config for ${agentMeta.role}:`, error);
        return createErrorCard(agentMeta.role);
      }
    }

    async function renderAiStaff() {
      const grid = document.getElementById("staffGrid");
      if (!grid || typeof jsyaml === "undefined") return;

      const cards = await Promise.all(AI_AGENTS.map((agent) => loadAgentCard(agent)));
      for (const card of cards) {
        grid.appendChild(card);
      }
    }

    renderAiStaff();
  </script>
</body>
</html>
