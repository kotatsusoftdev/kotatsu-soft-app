<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コタツ・ソフト | ヂャイアンの市場調査</title>
  <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./assets/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./assets/favicon-180.png" sizes="180x180" />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #fff8ef;
      --bg-1: #ffe5bf;
      --bg-2: #ffd095;
      --ink: #1f1a17;
      --ink-soft: #5e4f45;
      --brand-red: #bf2f2f;
      --brand-brown: #7f4a2e;
      --brand-cream: #fff4df;
      --card: rgba(255, 250, 242, 0.78);
      --stroke: rgba(87, 50, 34, 0.18);
      --shadow: 0 24px 60px rgba(84, 44, 13, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 94% -6%, rgba(255, 255, 255, 0.65), transparent 70%),
        radial-gradient(640px 380px at 12% 22%, rgba(255, 255, 255, 0.38), transparent 64%),
        linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
      font-family: "Avenir Next", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.11;
      background-image:
        radial-gradient(circle at 1px 1px, #000 0.7px, transparent 0.7px);
      background-size: 5px 5px;
      mix-blend-mode: multiply;
    }

    .scene {
      width: min(1120px, calc(100% - 28px));
      margin: 14px auto 32px;
      border: 1px solid var(--stroke);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 245, 229, 0.72));
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    header {
      position: relative;
      padding: 24px clamp(16px, 3vw, 34px) 10px;
      background:
        linear-gradient(90deg, rgba(191, 47, 47, 0.96), rgba(127, 74, 46, 0.9));
      color: #fff5e6;
      isolation: isolate;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -110px;
      width: 270px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      filter: blur(1px);
      z-index: -1;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-copy {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 12px;
      object-fit: cover;
      background: #fff4df;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 14px rgba(64, 24, 8, 0.22);
    }

    .logo {
      font-family: "DotGothic16", sans-serif;
      letter-spacing: 0.08em;
      font-weight: 400;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      margin: 0;
    }

    .tag {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffe8cc;
    }

    .back-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: start;
      text-decoration: none;
      color: #fff9f0;
      background: linear-gradient(90deg, #c63a31, #f06d36);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 22px rgba(94, 31, 12, 0.24);
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .back-cta:hover,
    .back-cta:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 12px 26px rgba(94, 31, 12, 0.3);
    }

    main {
      padding: 28px clamp(16px, 4vw, 40px) 30px;
    }

    .report-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: start;
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid rgba(123, 47, 18, 0.14);
      border-radius: 18px;
      background:
        radial-gradient(520px 180px at 8% 0%, rgba(255, 255, 255, 0.55), transparent 70%),
        linear-gradient(180deg, rgba(255, 252, 246, 0.96), rgba(255, 236, 210, 0.9));
      box-shadow: 0 10px 28px rgba(88, 53, 21, 0.08);
      margin-bottom: 22px;
    }

    .report-avatar {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe8c8, #ffd095);
      border: 2px solid rgba(191, 47, 47, 0.35);
      box-shadow: 0 8px 18px rgba(88, 53, 21, 0.16);
    }

    .report-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .report-copy {
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .report-name {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: #bf2f2f;
    }

    .report-speech {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.2rem, 2.8vw, 1.65rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.45;
      color: #7b2f12;
    }

    .report-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .report-meta li {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(123, 47, 18, 0.14);
      background: rgba(255, 248, 236, 0.9);
      font-size: 0.78rem;
      color: #6f5849;
      letter-spacing: 0.02em;
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .sec-head h2 {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.2rem, 2.6vw, 1.55rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #7b2f12;
    }

    .sec-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .status-msg {
      margin: 0 0 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(123, 47, 18, 0.14);
      background: rgba(255, 248, 236, 0.92);
      color: #6f5849;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .status-msg.is-error {
      border-color: rgba(191, 47, 47, 0.28);
      background: rgba(255, 236, 228, 0.95);
      color: #8a4a3a;
    }

    .trend-list {
      display: grid;
      gap: 14px;
    }

    .trend-card {
      border: 1px solid rgba(123, 47, 18, 0.14);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 252, 246, 0.96), rgba(255, 236, 210, 0.88));
      box-shadow: 0 8px 20px rgba(88, 53, 21, 0.08);
      padding: clamp(14px, 2.4vw, 22px);
      display: grid;
      gap: 12px;
    }

    .trend-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.4em;
      padding: 4px 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #c63a31, #e85a2a);
      color: #fff8ef;
      font-family: "DotGothic16", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 10px rgba(191, 47, 47, 0.22);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(123, 47, 18, 0.14);
      background: rgba(255, 255, 255, 0.55);
      font-size: 0.76rem;
      color: #6f5849;
      letter-spacing: 0.02em;
    }

    .pill.viral {
      border-color: rgba(191, 47, 47, 0.28);
      background: rgba(255, 236, 220, 0.95);
      color: #bf2f2f;
      font-weight: 700;
    }

    .trend-title {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 1.45;
      color: #7b2f12;
    }

    .trend-block {
      display: grid;
      gap: 6px;
    }

    .trend-label {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: #bf2f2f;
    }

    .trend-body {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #3d3028;
    }

    .hook-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .hook-list li {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(123, 47, 18, 0.1);
      background: rgba(255, 255, 255, 0.45);
      font-size: 0.9rem;
      line-height: 1.65;
      color: #3d3028;
    }

    .trend-original {
      border-radius: 10px;
      border: 1px solid rgba(123, 47, 18, 0.12);
      background: rgba(255, 248, 236, 0.7);
      padding: 8px 12px;
    }

    .trend-original summary {
      cursor: pointer;
      font-family: "DotGothic16", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      color: #7b2f12;
      list-style: none;
    }

    .trend-original summary::-webkit-details-marker {
      display: none;
    }

    .trend-original summary::before {
      content: "▶ ";
      font-size: 0.7em;
      color: #bf2f2f;
    }

    .trend-original[open] summary::before {
      content: "▼ ";
    }

    .trend-original p {
      margin: 10px 0 4px;
      font-size: 0.88rem;
      line-height: 1.65;
      color: #5e4f45;
      word-break: break-word;
    }

    .closing {
      margin-top: 22px;
      padding: clamp(16px, 2.5vw, 22px);
      border-radius: 16px;
      border: 1px solid rgba(191, 47, 47, 0.22);
      background: linear-gradient(180deg, rgba(255, 244, 228, 0.95), rgba(255, 220, 180, 0.9));
      text-align: center;
    }

    .closing p {
      margin: 0;
      font-family: "DotGothic16", sans-serif;
      font-size: clamp(1.05rem, 2.2vw, 1.3rem);
      letter-spacing: 0.04em;
      line-height: 1.5;
      color: #7b2f12;
    }

    footer {
      padding: 14px 18px 18px;
      color: #755f50;
      font-size: 0.79rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 700ms ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .brand-row {
        align-items: flex-start;
      }

      .back-cta {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 560px) {
      .report-hero {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .report-meta {
        justify-content: center;
      }

      .trend-top {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="scene">
    <header>
      <div class="brand-row">
        <div class="brand-copy">
          <div class="brand-mark">
            <img
              class="brand-icon"
              src="./assets/channel-icon.png"
              alt=""
              width="48"
              height="48"
              decoding="async"
            />
            <p class="logo">コタツ・ソフト</p>
          </div>
          <p class="tag">素人社長とAI社員がつくる、あたたかいインディーズゲームスタジオ</p>
        </div>
        <a class="back-cta" href="./index.html">ゲーム一覧へ戻る</a>
      </div>
    </header>

    <main>
      <section class="report-hero fade-up" aria-label="ヂャイアンの報告">
        <div class="report-avatar">
          <img
            id="gianAvatar"
            src="https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/ai-core/assets/avatars/marketing.png"
            alt="ヂャイアン"
            width="88"
            height="88"
            decoding="async"
          />
        </div>
        <div class="report-copy">
          <p class="report-name">ヂャイアン（マーケ）</p>
          <p class="report-speech">おう、のぶ太！オレ様が市場調査をぶちかましてやったぜ！</p>
          <ul class="report-meta" id="reportMeta" aria-live="polite">
            <li>読み込み中…</li>
          </ul>
        </div>
      </section>

      <div class="sec-head fade-up">
        <h2>トレンド上位、見やがれ！</h2>
        <p>バズ力が高い順に並べてやったぜ</p>
      </div>

      <p class="status-msg" id="statusMsg" hidden></p>
      <div class="trend-list" id="trendList" aria-live="polite"></div>

      <section class="closing fade-up" id="closing" hidden>
        <p>どうだ、すげえだろ！文句は言わせねえぜ！</p>
      </section>
    </main>

    <footer>
      Copyright 2026 コタツ・ソフト. All rights reserved.
    </footer>
  </div>

  <script>
    const REMOTE_TRENDS_URL =
      "https://raw.githubusercontent.com/kotatsusoftdev/kotatsu-soft-app/main/kotatsu-soft/shared/research/latest_trends.json";

    const statusMsgEl = document.getElementById("statusMsg");
    const trendListEl = document.getElementById("trendList");
    const reportMetaEl = document.getElementById("reportMeta");
    const closingEl = document.getElementById("closing");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function resolveLocalTrendsUrl() {
      if (window.location.protocol === "file:") {
        return null;
      }
      if (window.location.pathname.includes("/game-projects/")) {
        return "../shared/research/latest_trends.json";
      }
      return null;
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        method: "GET",
        cache: "no-store",
        headers: { accept: "application/json" },
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function loadTrendsPayload() {
      const localUrl = resolveLocalTrendsUrl();
      if (localUrl) {
        try {
          return await fetchJson(localUrl);
        } catch (_error) {
          // fall through to remote
        }
      }
      return fetchJson(REMOTE_TRENDS_URL);
    }

    function formatUpdatedAt(value) {
      if (!value) return "更新日時不明";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Asia/Tokyo",
      }).format(date);
    }

    function setMeta(payload, count) {
      const researcher = String(payload.researcher || "ヂャイアン").trim() || "ヂャイアン";
      const source = String(payload.data_source || "データソース不明").trim();
      const updated = formatUpdatedAt(payload.updated_at);
      reportMetaEl.innerHTML = `
        <li>調査員: ${escapeHtml(researcher)}</li>
        <li>件数: ${escapeHtml(String(count))}件</li>
        <li>更新: ${escapeHtml(updated)}</li>
        <li>${escapeHtml(source)}</li>
      `;
    }

    function showStatus(message, isError) {
      statusMsgEl.hidden = false;
      statusMsgEl.textContent = message;
      statusMsgEl.classList.toggle("is-error", Boolean(isError));
    }

    function hideStatus() {
      statusMsgEl.hidden = true;
      statusMsgEl.textContent = "";
      statusMsgEl.classList.remove("is-error");
    }

    function renderTrendCard(item, rank) {
      const keyword = item.keyword && typeof item.keyword === "object" ? item.keyword : {};
      const context = item.context && typeof item.context === "object" ? item.context : {};
      const abstracted = String(keyword.abstracted || "").trim() || "(タイトルなし)";
      const original = String(keyword.original || "").trim();
      const category = String(keyword.category || "").trim() || "カテゴリ不明";
      const platform = String(item.sns_platform || "Hybrid").trim() || "Hybrid";
      const summary = String(context.summary || "").trim() || "（要約なし）";
      const trigger = String(context.emotional_trigger || "").trim();
      const viral = item.viral_score != null ? String(item.viral_score) : "?";
      const hooks = Array.isArray(item.game_hook_ideas)
        ? item.game_hook_ideas.filter((h) => typeof h === "string" && h.trim())
        : [];

      const hooksHtml = hooks.length
        ? `<ul class="hook-list">${hooks
            .map((hook) => `<li>${escapeHtml(hook.trim())}</li>`)
            .join("")}</ul>`
        : `<p class="trend-body">フック案はまだねえな…次はもっと派手にいくぜ！</p>`;

      const originalHtml = original
        ? `<details class="trend-original">
            <summary>元ネタを見る</summary>
            <p>${escapeHtml(original)}</p>
          </details>`
        : "";

      const article = document.createElement("article");
      article.className = "trend-card fade-up";
      article.style.animationDelay = `${Math.min(rank, 8) * 60}ms`;
      article.innerHTML = `
        <div class="trend-top">
          <span class="rank-badge">#${escapeHtml(String(rank))}</span>
          <span class="pill viral">バズ力 ${escapeHtml(viral)}</span>
          <span class="pill">${escapeHtml(platform)}</span>
          <span class="pill">${escapeHtml(category)}</span>
        </div>
        <h3 class="trend-title">${escapeHtml(abstracted)}</h3>
        <div class="trend-block">
          <p class="trend-label">オレ様の解釈</p>
          <p class="trend-body">${escapeHtml(summary)}</p>
        </div>
        ${
          trigger
            ? `<div class="trend-block">
                <p class="trend-label">心を掴むポイント</p>
                <p class="trend-body">${escapeHtml(trigger)}</p>
              </div>`
            : ""
        }
        <div class="trend-block">
          <p class="trend-label">ゲームに落とすならこれだ！</p>
          ${hooksHtml}
        </div>
        ${originalHtml}
      `;
      return article;
    }

    async function init() {
      try {
        const payload = await loadTrendsPayload();
        const trends = Array.isArray(payload.trends)
          ? payload.trends.filter((item) => item && typeof item === "object")
          : [];

        const sorted = [...trends].sort((a, b) => {
          const scoreA = Number(a.viral_score);
          const scoreB = Number(b.viral_score);
          const safeA = Number.isFinite(scoreA) ? scoreA : -1;
          const safeB = Number.isFinite(scoreB) ? scoreB : -1;
          return safeB - safeA;
        });

        setMeta(payload, sorted.length);

        if (!sorted.length) {
          showStatus("チッ…今回はトレンドがゼロ件だ。次は本気出すから待ってろ！", true);
          closingEl.hidden = true;
          return;
        }

        hideStatus();
        trendListEl.replaceChildren(...sorted.map((item, index) => renderTrendCard(item, index + 1)));
        closingEl.hidden = false;
      } catch (_error) {
        reportMetaEl.innerHTML = "<li>読み込み失敗</li>";
        showStatus(
          "ぐあっ！データが読み込めねえ！のぶ太、回線かファイルを疑え！",
          true
        );
        closingEl.hidden = true;
      }
    }

    init();
  </script>
</body>
</html>
