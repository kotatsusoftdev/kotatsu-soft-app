version: '3.8'

services:
  # 1. AI社員 Bot 実行コンテナ
  ai-core:
    build:
      context: ./ai-core
      dockerfile: Dockerfile
    container_name: kotatsu_ai_core
    env_file:
      - .env
    volumes:
      - ./ai-core:/app/ai-core
      - ./shared:/app/shared
      - ./game-projects:/app/game-projects
    restart: unless-stopped
