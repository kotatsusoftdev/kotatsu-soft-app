name: Deploy game-projects to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "kotatsu-soft/game-projects/**"
      - "kotatsu-soft/shared/**"
      - ".github/workflows/game-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p _pages/shared/specs _pages/shared/meeting
          cp -r kotatsu-soft/game-projects/. _pages/
          cp kotatsu-soft/shared/spec.html _pages/shared/
          cp kotatsu-soft/shared/meeting.html _pages/shared/
          cp kotatsu-soft/shared/specs/* _pages/shared/specs/
          if compgen -G "kotatsu-soft/shared/meeting/*.jsonl" > /dev/null; then
            cp kotatsu-soft/shared/meeting/*.jsonl _pages/shared/meeting/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
