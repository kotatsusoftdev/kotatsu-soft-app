name: Deploy game-projects to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "kotatsu-soft/game-projects/**"
      - "kotatsu-soft/shared/**"
      - ".github/workflows/game-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  quality:
    name: Pre-deploy quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotatsu-soft/ai-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check game syntax and portal listing
        run: python scripts/check_game_quality.py

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p _pages/shared/specs _pages/shared/meeting
          cp -r kotatsu-soft/game-projects/. _pages/
          cp kotatsu-soft/shared/spec.html _pages/shared/
          cp kotatsu-soft/shared/meeting.html _pages/shared/
          cp kotatsu-soft/shared/specs/* _pages/shared/specs/
          if compgen -G "kotatsu-soft/shared/meeting/*.jsonl" > /dev/null; then
            cp kotatsu-soft/shared/meeting/*.jsonl _pages/shared/meeting/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
